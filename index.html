<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans Arabic",Tahoma,sans-serif;background:#f4f1ea;color:#222;font-size:17px}
header{background:#1f4e3d;color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}
header small{opacity:.85}
main{padding:12px;max-width:640px;margin:auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid #bbb;background:#fff}
button{background:#1f4e3d;color:#fff;border:0;font-weight:700;margin-top:10px}
button.sec{background:#e5e0d3;color:#222}
button.red{background:#b3261e}
button:disabled{opacity:.45}
.row{display:flex;gap:8px}.row>*{flex:1}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.thumbs img{height:84px;width:84px;object-fit:cover;border-radius:8px;border:2px solid #ddd}
.thumbs img.sel{border-color:#1f4e3d}
.hint{font-size:14px;color:#666;margin-top:4px}
.ok{color:#1b7a3d;font-weight:700}.warn{color:#b3261e;font-weight:700}
.cat{font-weight:800;margin:14px 0 6px;background:#e5e0d3;padding:6px 10px;border-radius:8px}
.item{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #eee}
.item img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.item .t{flex:1}.item button{width:auto;margin:0;padding:8px 12px}
.stats{display:flex;gap:8px}.stats div{flex:1;text-align:center;background:#eef5f0;border-radius:10px;padding:8px}
.stats b{display:block;font-size:22px}
#toast{position:fixed;bottom:14px;left:12px;right:12px;background:#222;color:#fff;padding:12px;border-radius:10px;display:none;z-index:9;text-align:center}
details summary{font-weight:700;padding:6px 0}
.map{display:flex;gap:6px;margin:4px 0}.map input{width:90px}.map select{flex:1}

.tabs{display:flex;background:#16392c}.tabs button{border-radius:0;margin:0;background:transparent;color:#cfe3d8;border-bottom:4px solid transparent;padding:12px}
.tabs button.on{color:#fff;border-bottom-color:#e8c15a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gi{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#ddd;cursor:pointer}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi span{position:absolute;bottom:0;left:0;right:0;background:#000a;color:#fff;font-size:12px;text-align:center;padding:2px}
.gi.loc::after{content:"محلي";position:absolute;top:4px;right:4px;background:#e8c15a;color:#222;font-size:11px;padding:1px 5px;border-radius:6px}
details.gc{margin-bottom:10px}details.gc>summary{font-weight:800;background:#e5e0d3;padding:8px 10px;border-radius:8px;margin-bottom:6px;list-style:none}
.chips{display:flex;gap:6px;margin:8px 0}.chips button{margin:0;padding:8px;font-size:15px}
#ov{position:fixed;inset:0;padding-bottom:env(safe-area-inset-bottom);background:#000d;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
#ov img{max-width:100%;max-height:70vh;max-height:65dvh;border-radius:8px}#ov .cap{color:#fff;margin:10px;font-size:18px;text-align:center}
#ov .row{width:100%;max-width:420px}
.gi.err{background:#eee;min-height:90px}.gi.err::before{content:"📷";display:block;text-align:center;font-size:28px;padding-top:20px}#ov .nav{direction:ltr;unicode-bidi:isolate;position:absolute;top:36%;width:46px;height:46px;border-radius:50%;margin:0;padding:0;background:#000a;color:#fff;font-size:22px;border:1px solid #fff6;z-index:2}#ov{touch-action:pan-y}.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.cgrid{grid-template-columns:repeat(4,1fr)}}
.cc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #1f4e3d22;cursor:pointer}
.cc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
.cn{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;color:#1f4e3d}.cn i{font-style:normal;background:#c9a24a;color:#fff;border-radius:10px;padding:1px 8px;font-size:13px}
.backbar[hidden]{display:none}.rakd{display:flex;justify-content:space-between;align-items:center;background:#c62828;color:#fff;border-radius:16px;padding:16px 18px;margin:4px 0 12px;font-size:19px;box-shadow:0 2px 10px #c6282855;cursor:pointer}.rakd i{font-style:normal;background:#fff;color:#c62828;border-radius:12px;padding:2px 12px;font-size:15px;font-weight:700}
.sech{font-weight:700;color:#1f4e3d;margin:10px 2px 8px}
.backbar{display:flex;align-items:center;gap:10px;margin:6px 0 10px}.backbar button{background:#1f4e3d;color:#fff;border:0;border-radius:12px;padding:8px 14px;font-size:15px}
#ownerBar{display:flex;gap:8px;align-items:center;margin:6px 0}#ownerBar[hidden]{display:none}#ownerBar span{color:#b3261e;font-weight:700}
#ownM{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}#ownM>div{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:85vh;overflow:auto}
#ownM input{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:10px;margin:8px 0}
.trow{display:flex;align-items:center;gap:8px;margin:6px 0}.trow img{width:44px;height:44px;object-fit:cover;border-radius:8px}.trow span{flex:1}

<style>

<script>
"use strict";
const CATS={
"منزلي":["سرير مفرد","سرير دورين","سرير مزدوج","طاولة خدمة","طاولة طعام","طاولة حفلات","طاولة كوي","طاولة مدخل","طقم 2كرسي + طاولة","كنب منزلي","جلسات حدائق","دولاب تليفزيون","دولاب بلازما","دولاب ملابس","دولاب تسريحه","دولاب احذية","دولاب بوفيه","مرتبة طبي","مرتبة اسفنج","مرتبة اسبرنج","ديكورات","مزهريات","غرفة نوم","ملحقات غرف نوم","مظلات","مفارش طاولات","اغطية كراسي","كرسي حفلات","كرسي مساج","كرسي طعام"],
"مكتبي":["طاولة خدمة","ملحقات أثاث مكتبى","طاولة اجتماع","طاولة مكتب صغيرة","طاولة استقبال","طاولات كمبيوتر","كرسي محاضرات","كرسي انتظار","كرسي ثابت","كرسي دوار","كرسي مسرح مكتبي","دولاب ملفات صغيرة","دولاب ملفات كبيرة","كنب مكتبي","طاولات مدرسية","وحدة عمل","وحدة استقبال","مكتب موظف","مكتب اداري","مكتب مدير","كراسي"]};
// Presets = prefixes published on the shared catalog; editable per device.
const SEED={"020":["مكتبي","كنب مكتبي"],"202":["منزلي","طاولة طعام"],"201":["مكتبي","طاولة خدمة"],"010":["مكتبي","مكتب مدير"],"015":["مكتبي","وحدة استقبال"],"031":["مكتبي","دولاب ملفات كبيرة"],"042":["مكتبي","كرسي دوار"],"043":["مكتبي","كرسي ثابت"],"044":["مكتبي","كرسي انتظار"],"041":["مكتبي","كرسي مسرح مكتبي"],"504":["مكتبي","طاولة اجتماع"],"103":["منزلي","كرسي مساج"]};
const $=id=>document.getElementById(id);
const AR="٠١٢٣٤٥٦٧٨٩",FA="۰۱۲۳۴۵۶۷۸۹";
function normDigits(s){return s.replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>FA.indexOf(d))}
function normCode(raw){
  let s=normDigits(raw||"").trim();
  const only=s.replace(/[^0-9]/g,"");
  if(/^\d{7}$/.test(only)&&!/[A-Za-z]/.test(s)) return only.slice(0,3)+"-"+only.slice(3);
  return s.replace(/[\\\/:*?"<>|]/g,"").replace(/\s+/g,"").replace(/_/g,"-");
}
function validCode(c){return /^\d{3}-\d{4}$/.test(c)}
// ---- IndexedDB
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("repphotos",1);
 r.onupgradeneeded=()=>{r.result.createObjectStore("photos",{keyPath:"id",autoIncrement:true});r.result.createObjectStore("kv")};
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
const tx=(s,m="readonly")=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const allPhotos=()=>req(tx("photos").getAll());
// fallback memory store if IndexedDB is blocked
let mem=[],useMem=false;
async function getAll(){return useMem?mem.slice():allPhotos()}
async function add(p){if(useMem){p.id=mem.length+1+Math.random();mem.push(p)}else await req(tx("photos","readwrite").add(p))}
async function del(id){if(useMem)mem=mem.filter(x=>x.id!==id);else await req(tx("photos","readwrite").delete(id))}
async function wipe(){if(useMem)mem=[];else await req(tx("photos","readwrite").clear())}
let maps={...SEED};
async function loadMaps(){try{const v=useMem?null:await req(tx("kv").get("maps"));if(v)maps={...SEED,...v}}catch(e){}}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res({i,u})};i.onerror=()=>rej(new Error("img"));i.src=u})}
async function shrink(file,max=1600,q=0.85){
  const {i,u}=await loadImg(file);
  let w=i.naturalWidth,h=i.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(i,0,0,w,h);
  URL.revokeObjectURL(u);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
  const tc=document.createElement("canvas");const tk=160/Math.max(w,h);tc.width=Math.round(w*tk);tc.height=Math.round(h*tk);tc.getContext("2d").drawImage(c,0,0,tc.width,tc.height);
  const thumb=tc.toDataURL("image/jpeg",0.7);
  return {blob,thumb};
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function dosTime(d){return{t:(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),d:((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()}}
async function makeZip(entries){
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;const dt=dosTime(new Date());
  for(const e of entries){
    const name=enc.encode(e.path),data=new Uint8Array(await e.blob.arrayBuffer()),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt.t,true);h.setUint16(12,dt.d,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt.t,true);c.setUint16(14,dt.d,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cd.push(c.buffer,name);off+=30+name.length+data.length}
  let cdSize=0;cd.forEach(b=>cdSize+=b.byteLength);
  const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end.buffer],{type:"application/zip"});
}
async function buildZip(){
  const items=await getAll();if(!items.length)return null;
  const named=fileNames(items);
  const entries=named.map(n=>({path:n.path,blob:n.p.blob}));
  const csv="\ufeffcode,section,category,note,file\r\n"+named.map(n=>[n.p.code,n.p.sec,n.p.cat,n.p.note,n.path].map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
  entries.push({path:"index.csv",blob:new Blob([csv],{type:"text/csv"})});
  const d=new Date(),pad=n=>String(n).padStart(2,"0");
  const name="photos-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"-"+pad(d.getHours())+pad(d.getMinutes())+".zip";

const OW={fails:0,until:0,tok:null,taps:0,t0:0};
const b64d=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function ownUnlock(code){
  if(Date.now()<OW.until)throw new Error("انتظر قليلا");
  const o=await (await fetch("owner.json?"+Date.now())).json();
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveBits"]);
  const k=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64d(o.s),iterations:o.i},km,512));
  const hk=n=>crypto.subtle.importKey("raw",k.slice(n,n+32),{name:"HMAC",hash:"SHA-256"},false,["sign","verify"]);
  const nonce=b64d(o.n),ct=b64d(o.c),mk=await hk(32);
  const cat=new Uint8Array(nonce.length+ct.length);cat.set(nonce);cat.set(ct,nonce.length);
  if(!(await crypto.subtle.verify("HMAC",mk,b64d(o.t),cat))){OW.fails++;if(OW.fails>=3){OW.until=Date.now()+60000;OW.fails=0}throw new Error("الكود غير صحيح")}
  const ek=await hk(0);let ks=new Uint8Array(0),c=0;
  while(ks.length<ct.length){const m=new Uint8Array(nonce.length+4);m.set(nonce);new DataView(m.buffer).setUint32(nonce.length,c++);const d=new Uint8Array(await crypto.subtle.sign("HMAC",ek,m));const n=new Uint8Array(ks.length+32);n.set(ks);n.set(d,ks.length);ks=n}
  OW.fails=0;OW.tok=new TextDecoder().decode(ct.map((v,i)=>v^ks[i]));
}
const API="https://api.github.com/repos/alsarie-intl-catalog/photos/contents/hidden.json";
async function ownSave(mut){
  for(let a=0;a<4;a++){
    const h={Authorization:"Bearer "+OW.tok,Accept:"application/vnd.github+json"};
    const r=await fetch(API+"?ref=main&t="+Date.now(),{headers:h,cache:"no-store"});if(!r.ok)throw new Error("GET "+r.status);
    const j=await r.json();let cur={items:[]};try{cur=JSON.parse(new TextDecoder().decode(b64d(j.content.replace(/\n/g,""))))}catch(e){}
    cur.items=mut(cur.items||[]);
    const body=btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(cur))));
    const p=await fetch(API,{method:"PUT",headers:h,body:JSON.stringify({message:"owner: update hidden",content:body,sha:j.sha,branch:"main"})});
    if(p.ok){HIDL=cur.items;HID=new Set(HIDL.map(x=>x.i));return}
    if(p.status!==409&&p.status!==422)throw new Error("PUT "+p.status)}
  throw new Error("تعذر الحفظ");
}
