<body>
<header><h1>السريع الدولية</h1><small>Alsourayi · تطبيق صور الأصناف</small></header>

<main>
<div id="viewAdd">
<div class="card" id="addCard">
  <div class="steps"><span>١ صوّر</span><i>›</i><span>٢ اكتب الكود</span><i>›</i><span>٣ احفظ</span></div>
  <div class="row big">
    <button type="button" id="btnCam"><b>📸</b>تصوير</button>
    <button type="button" id="btnPick" class="sec"><b>🖼️</b>من المعرض</button>
  </div>
  <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="fPick" accept="image/*" multiple hidden>
  <div class="thumbs" id="pending"></div>
  <div id="form" hidden>
    <label for="code">كود الصنف (مثال 041-0005)</label>
    <input id="code" inputmode="numeric" autocomplete="off" placeholder="041-0005">
    <div class="hint" id="codeHint"></div>
    <label for="sec">القسم</label>
    <select id="sec"></select>
    <label for="cat">الفئة</label>
    <select id="cat"></select>
    <div class="hint" id="catHint"></div>
    <label for="note">ملاحظة اللون / الزاوية (اختياري)</label>
    <input id="note" placeholder="أسود / بني / جانب">
    <button type="button" id="btnSave">✔ حفظ الصور (<span id="nPend">0</span>)</button>
    <button type="button" id="btnClear" class="sec">إلغاء</button>
  </div>
</div>

<div class="card" id="sendBox" style="display:none">
  <div class="h2" id="sendMsg">صور محفوظة على جهازك</div>
  <button type="button" id="btnSend" class="sec">📤 إرسال الصور</button>
  <button type="button" id="btnSentOk" class="link" hidden>✔ تم الإرسال، امسح النسخة من جهازي</button>
  <div class="hint" id="sendHint"></div>
</div>
<div class="card" id="statCard">
  <div class="stats"><div><b id="sTot">0</b>صورة</div><div><b id="sCat">0</b>فئة</div><div><b id="sCodes">0</b>كود</div></div>
  <button type="button" id="btnExport" hidden style="display:none">تصدير</button>
  <button type="button" id="btnShare" hidden style="display:none">x</button>
  <div class="hint" id="exHint"></div>
</div>

<div class="card" id="listCard"><div class="h2">صوري المحفوظة على الجهاز</div><div id="list"></div><button type="button" id="btnWipe" class="red" hidden>مسح كل الصور المحفوظة</button></div>

<div class="card" id="mapCard"><details><summary>⚙ إعدادات: ربط بادئة الكود بالفئة</summary>
<div class="hint">لو الكود يبدأ بـ 041 يتصنف تلقائي. أي بادئة جديدة اختار لها فئة مرة واحدة وهتتحفظ.</div>
<div id="maps"></div><button type="button" id="btnAddMap" class="sec">+ إضافة ربط</button></details></div>
</div>
<div id="viewGal" hidden>
<div class="card">
  <div class="sbar"><input id="gq" placeholder="🔍 ابحث بالكود (مثال 044 أو 0124)" inputmode="search"><button type="button" id="btnRef" class="ic" aria-label="تحديث المعرض">🔄</button></div>
  <div class="seg"><button type="button" id="gAll" class="">الكل</button><button type="button" id="gHome" class="sec">منزلي</button><button type="button" id="gOff" class="sec">مكتبي</button></div><div id="catChips" class="catchips" hidden></div>

<script>
"use strict";
const CATS={
"منزلي":["سرير مفرد","سرير دورين","سرير مزدوج","طاولة خدمة","طاولة طعام","طاولة حفلات","طاولة كوي","طاولة مدخل","طقم 2كرسي + طاولة","كنب منزلي","جلسات حدائق","دولاب تليفزيون","دولاب بلازما","دولاب ملابس","دولاب تسريحه","دولاب احذية","دولاب بوفيه","مرتبة طبي","مرتبة اسفنج","مرتبة اسبرنج","ديكورات","مزهريات","غرفة نوم","ملحقات غرف نوم","مظلات","مفارش طاولات","اغطية كراسي","كرسي حفلات","كرسي مساج","كرسي طعام"],
"مكتبي":["طاولة خدمة","ملحقات أثاث مكتبى","طاولة اجتماع","طاولة مكتب صغيرة","طاولة استقبال","طاولات كمبيوتر","كرسي محاضرات","كرسي انتظار","كرسي ثابت","كرسي دوار","كرسي مسرح مكتبي","دولاب ملفات صغيرة","دولاب ملفات كبيرة","كنب مكتبي","طاولات مدرسية","وحدة عمل","وحدة استقبال","مكتب موظف","مكتب اداري","مكتب مدير","كراسي"]};
// Presets = prefixes published on the shared catalog; editable per device.
const SEED={"020":["مكتبي","كنب مكتبي"],"202":["منزلي","طاولة طعام"],"201":["مكتبي","طاولة خدمة"],"010":["مكتبي","مكتب مدير"],"015":["مكتبي","وحدة استقبال"],"031":["مكتبي","دولاب ملفات كبيرة"],"042":["مكتبي","كرسي دوار"],"043":["مكتبي","كرسي ثابت"],"044":["مكتبي","كرسي انتظار"],"041":["مكتبي","كرسي مسرح مكتبي"],"504":["مكتبي","طاولة اجتماع"],"103":["منزلي","كرسي مساج"]};
const $=id=>document.getElementById(id);
const AR="٠١٢٣٤٥٦٧٨٩",FA="۰۱۲۳۴۵۶۷۸۹";
function normDigits(s){return s.replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>FA.indexOf(d))}
function normCode(raw){
  let s=normDigits(raw||"").trim();
  const only=s.replace(/[^0-9]/g,"");
  if(/^\d{7}$/.test(only)&&!/[A-Za-z]/.test(s)) return only.slice(0,3)+"-"+only.slice(3);

const OW={fails:0,until:0,tok:null,taps:0,t0:0};
const b64d=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function ownUnlock(code){
  if(Date.now()<OW.until)throw new Error("انتظر قليلا");
  const o=await (await fetch("owner.json?"+Date.now())).json();
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveBits"]);
  const k=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64d(o.s),iterations:o.i},km,512));
  const hk=n=>crypto.subtle.importKey("raw",k.slice(n,n+32),{name:"HMAC",hash:"SHA-256"},false,["sign","verify"]);
  const nonce=b64d(o.n),ct=b64d(o.c),mk=await hk(32);
  const cat=new Uint8Array(nonce.length+ct.length);cat.set(nonce);cat.set(ct,nonce.length);
  if(!(await crypto.subtle.verify("HMAC",mk,b64d(o.t),cat))){OW.fails++;if(OW.fails>=3){OW.until=Date.now()+60000;OW.fails=0}throw new Error("الكود غير صحيح")}
  const ek=await hk(0);let ks=new Uint8Array(0),c=0;
  while(ks.length<ct.length){const m=new Uint8Array(nonce.length+4);m.set(nonce);new DataView(m.buffer).setUint32(nonce.length,c++);const d=new Uint8Array(await crypto.subtle.sign("HMAC",ek,m));const n=new Uint8Array(ks.length+32);n.set(ks);n.set(d,ks.length);ks=n}
  OW.fails=0;OW.tok=new TextDecoder().decode(ct.map((v,i)=>v^ks[i]));
}
const API="https://api.github.com/repos/alsarie-intl-catalog/photos/contents/hidden.json";
async function ownSave(mut){
  for(let a=0;a<4;a++){
    const h={Authorization:"Bearer "+OW.tok,Accept:"application/vnd.github+json"};
    const r=await fetch(API+"?ref=main&t="+Date.now(),{headers:h,cache:"no-store"});if(!r.ok)throw new Error("GET "+r.status);
    const j=await r.json();let cur={items:[]};try{cur=JSON.parse(new TextDecoder().decode(b64d(j.content.replace(/\n/g,""))))}catch(e){}
    cur.items=mut(cur.items||[]);
    const body=btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(cur))));
    const p=await fetch(API,{method:"PUT",headers:h,body:JSON.stringify({message:"owner: update hidden",content:body,sha:j.sha,branch:"main"})});
    if(p.ok){HIDL=cur.items;HID=new Set(HIDL.map(x=>x.i));return}
    if(p.status!==409&&p.status!==422)throw new Error("PUT "+p.status)}
  throw new Error("تعذر الحفظ");
}
